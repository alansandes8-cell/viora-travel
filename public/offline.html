<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · VIORA TRAVEL</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; color: #1f2937; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { color: #1b2a4a; font-size: 1.5rem; margin: 0; }
      p { margin: 0; color: #5b6478; line-height: 1.5; }
      button { background: #1b2a4a; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font: inherit; font-weight: 700; min-height: 44px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="VIORA TRAVEL" />
      <h1>Sin conexión</h1>
      <p>Parece que no hay internet. Lo que ya se guardó no se pierde: cuando vuelva la conexión, reintentá.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
